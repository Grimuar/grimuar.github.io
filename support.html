<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Gramma: First Words</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .support-card {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            text-align: center;
        }

        h1 {
            color: #0056b3;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .contact-box {
            background-color: #f1f5f9;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .email-link {
            display: block;
            font-size: 1.2rem;
            color: #0056b3;
            text-decoration: none;
            font-weight: 700;
            word-break: break-all;
        }

        .email-link:hover {
            text-decoration: underline;
        }

        .info-label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            margin-bottom: 8px;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #a0aec0;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: #2d3748;
        }

        .developer-info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <div class="support-card">
        <h1>Support</h1>
        <p>Have questions, feedback, or need technical assistance with <strong>Gramma: First Words</strong>? We're here to help!</p>
        
        <div class="contact-box">
            <span class="info-label">Contact Email</span>
            <a href="mailto:egorban.studio@gmail.com" class="email-link">egorban.studio@gmail.com</a>
        </div>

        <div class="developer-info">
            <strong>Gorban Studio</strong><br>
            Developer: Egor Gorban<br>
            Location: Russia
        </div>

        <a href="index.html" class="back-home">← Back to Homepage</a>
    </div>

</body>
</html>
